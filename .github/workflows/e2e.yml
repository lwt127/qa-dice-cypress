name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Gate: everything except tests for known, documented defects. Must be green.
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v6
        with:
          browser: chrome
          env: skipKnownBugs=true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  # Full suite including known-bug tests. Expected to fail until BUGS.md items are fixed;
  # it turns green on its own once they are, which is the signal to drop the knownBug() wrapper.
  known-bugs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v6
        with:
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: known-bug-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
